name: vsixbuilder

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_call:
    inputs:
      require-sbom:
        description: Fail when the ggshield release has no SBOM
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build_vsix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
          - target: darwin-arm64
          - target: linux-x64
          - target: win32-x64
          - target: win32-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js and tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: npm ci

      - name: Build platform-specific VSIX
        env:
          GGSHIELD_TARGET: ${{ matrix.target }}
        run: |
          npx vsce package --target ${{ matrix.target }} \
            --baseContentUrl https://github.com/GitGuardian/gitguardian-vscode/ \
            --allow-missing-repository \
            -o gitguardian-${{ matrix.target }}.vsix

      # Until ggshield_version points to a ggshield release that publishes
      # SBOMs, only releases require one
      - name: Generate SBOM
        env:
          ALLOW_MISSING: ${{ !inputs.require-sbom && '--allow-missing-ggshield-sbom' || '' }}
        run: |
          node scripts/generate-sbom.mjs --target ${{ matrix.target }} \
            -o gitguardian-${{ matrix.target }}.cdx.json $ALLOW_MISSING

      - name: Upload extension package
        uses: actions/upload-artifact@v7
        with:
          name: gitguardian-${{ matrix.target }}.vsix
          path: gitguardian-${{ matrix.target }}.vsix

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: gitguardian-${{ matrix.target }}.cdx.json
          path: gitguardian-${{ matrix.target }}.cdx.json
          if-no-files-found: ${{ inputs.require-sbom && 'error' || 'warn' }}
